# Publica o frontend no GitHub Pages a cada push na branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Instalar dependências
        # O package-lock.json foi gerado no Windows; se o npm ci recusar no Linux,
        # o npm install resolve os pacotes específicos da plataforma.
        run: npm ci || (echo "::warning::npm ci falhou, usando npm install" && npm install --no-audit --no-fund)
      - name: Instalar backend (usado no teste de integração)
        working-directory: backend
        run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - name: Compilar site estático
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
